apiVersion: apps/v1
kind: Deployment
metadata:
  name: channelsvr
  namespace: game-im-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: channelsvr
  template:
    metadata:
      labels:
        app: channelsvr
    spec:
      containers:
      - name: channelsvr
        image: game-im/channelsvr:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 10003
        envFrom:
        - configMapRef:
            name: game-im-config
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}